name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    name: Ruby syntax and storage security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - name: Ruby syntax
        run: find . -name "*.rb" -print0 | xargs -0 -n1 ruby -c
      - name: Storage security tests
        run: ruby test/unit/storage_security_test.rb

  test:
    name: Redmine 7.0.1 plugin tests (MySQL 8)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      mysql:
        image: mysql:8.0.46
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: redmine_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=18
    steps:
      - name: Checkout Redmine 7.0.1
        uses: actions/checkout@v4
        with:
          repository: redmine/redmine
          ref: 7.0.1
          path: redmine

      - name: Install plugin
        uses: actions/checkout@v4
        with:
          path: redmine/plugins/redmine_cloud_attachment

      # The published MinIO image command is `minio` and does not start the
      # server. GitHub Actions service containers cannot replace that command,
      # so this step runs `minio server /data` directly.
      - name: Start MinIO
        run: |
          docker run -d --name ci-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:RELEASE.2025-09-07T16-13-09Z \
            server /data

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            default-libmysqlclient-dev \
            pkg-config \
            libyaml-dev \
            curl

      - name: Configure database
        working-directory: redmine
        run: |
          cat > config/database.yml <<'YAML'
          test:
            adapter: mysql2
            database: redmine_test
            username: root
            password: root
            host: 127.0.0.1
            encoding: utf8mb4
          YAML

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.3"
          bundler: "2.6.9"

      - name: Install gems
        working-directory: redmine
        run: |
          bundle config set --local without 'development minimagick'
          bundle install

      - name: Wait for MinIO
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live; then
              exit 0
            fi
            sleep 2
          done
          docker logs ci-minio
          exit 1

      - name: Migrate and run plugin tests
        working-directory: redmine
        env:
          RAILS_ENV: test
          MINIO_ENDPOINT: http://127.0.0.1:9000
          MINIO_ACCESS_KEY_ID: minioadmin
          MINIO_SECRET_ACCESS_KEY: minioadmin
          MINIO_BUCKET: redmine-attachments
        run: |
          ruby -v
          bundle exec rake db:migrate redmine:plugins:migrate NAME=redmine_cloud_attachment
          bundle exec rails runner 'puts %(Rails #{Rails.version}); puts %(Redmine #{Redmine::VERSION}); puts %(MySQL #{ActiveRecord::Base.connection.select_value(%q{SELECT VERSION()})})'
          bundle exec rake redmine:plugins:test NAME=redmine_cloud_attachment
